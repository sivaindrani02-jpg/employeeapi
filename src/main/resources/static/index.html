<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>EmployeeHub | Employee Management</title>

    <style>

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: "Segoe UI", Arial, sans-serif;
        }

        body {
            background: #f4f7fb;
            color: #1e293b;
            min-height: 100vh;
            transition: 0.3s;
        }

        /* ================= HEADER ================= */

        header {
            background: linear-gradient(135deg, #4f46e5, #7c3aed);
            color: white;
            padding: 20px 6%;
            display: flex;
            justify-content: space-between;
            align-items: center;
            box-shadow: 0 5px 20px rgba(79, 70, 229, 0.25);
        }

        .logo {
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .logo-icon {
            width: 45px;
            height: 45px;
            background: rgba(255,255,255,0.2);
            border-radius: 12px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 23px;
        }

        .logo h1 {
            font-size: 23px;
        }

        .logo p {
            font-size: 12px;
            opacity: 0.8;
        }

        .dark-btn {
            background: rgba(255,255,255,0.18);
            border: 1px solid rgba(255,255,255,0.3);
            color: white;
            padding: 10px 15px;
            border-radius: 10px;
            cursor: pointer;
            font-size: 15px;
        }

        /* ================= CONTAINER ================= */

        .container {
            width: 90%;
            max-width: 1200px;
            margin: 35px auto;
        }

        .welcome {
            margin-bottom: 25px;
        }

        .welcome h2 {
            font-size: 28px;
            margin-bottom: 6px;
        }

        .welcome p {
            color: #64748b;
        }

        /* ================= STATS ================= */

        .stats {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 20px;
            margin-bottom: 30px;
        }

        .stat-card {
            background: white;
            padding: 22px;
            border-radius: 16px;
            display: flex;
            align-items: center;
            gap: 18px;
            box-shadow: 0 5px 20px rgba(0,0,0,0.06);
            transition: 0.3s;
        }

        .stat-card:hover {
            transform: translateY(-4px);
        }

        .stat-icon {
            width: 55px;
            height: 55px;
            border-radius: 14px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 25px;
            background: #eef2ff;
        }

        .stat-card h3 {
            font-size: 25px;
        }

        .stat-card p {
            color: #64748b;
            font-size: 13px;
        }

        /* ================= FORM ================= */

        .form-card {
            background: white;
            padding: 28px;
            border-radius: 18px;
            box-shadow: 0 5px 20px rgba(0,0,0,0.06);
            margin-bottom: 30px;
        }

        .form-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 22px;
        }

        .form-header h2 {
            font-size: 21px;
        }

        .form-header span {
            color: #64748b;
            font-size: 13px;
        }

        .form-grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 18px;
        }

        .form-group {
            position: relative;
        }

        .form-group label {
            display: block;
            margin-bottom: 7px;
            font-size: 13px;
            font-weight: 600;
            color: #475569;
        }

        .form-group input {
            width: 100%;
            padding: 13px 14px;
            border: 1px solid #dbe2ea;
            border-radius: 10px;
            outline: none;
            font-size: 14px;
            transition: 0.3s;
            background: #fafbfc;
        }

        .form-group input:focus {
            border-color: #6366f1;
            box-shadow: 0 0 0 3px rgba(99,102,241,0.1);
            background: white;
        }

        .form-actions {
            margin-top: 22px;
        }

        button {
            border: none;
            cursor: pointer;
            transition: 0.25s;
        }

        .primary-btn {
            background: linear-gradient(135deg, #4f46e5, #7c3aed);
            color: white;
            padding: 13px 25px;
            border-radius: 10px;
            font-weight: 600;
        }

        .primary-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(79,70,229,0.3);
        }

        .cancel-btn {
            background: #e2e8f0;
            color: #475569;
            padding: 13px 22px;
            border-radius: 10px;
            margin-left: 8px;
        }

        /* ================= TABLE ================= */

        .table-card {
            background: white;
            padding: 28px;
            border-radius: 18px;
            box-shadow: 0 5px 20px rgba(0,0,0,0.06);
        }

        .table-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
        }

        .table-header h2 {
            font-size: 21px;
        }

        .search-box {
            padding: 11px 15px;
            border: 1px solid #dbe2ea;
            border-radius: 10px;
            outline: none;
            width: 230px;
        }

        .table-wrapper {
            overflow-x: auto;
        }

        table {
            width: 100%;
            border-collapse: collapse;
        }

        th {
            background: #f8fafc;
            color: #64748b;
            font-size: 12px;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        th, td {
            padding: 15px;
            border-bottom: 1px solid #edf0f4;
            text-align: left;
        }

        td {
            font-size: 14px;
        }

        tr:hover {
            background: #fafbff;
        }

        .employee-name {
            font-weight: 600;
        }

        .employee-id {
            background: #eef2ff;
            color: #4f46e5;
            padding: 5px 9px;
            border-radius: 7px;
            font-size: 12px;
        }

        .department {
            background: #f1f5f9;
            padding: 5px 10px;
            border-radius: 20px;
            font-size: 12px;
        }

        .edit-btn {
            background: #fef3c7;
            color: #92400e;
            padding: 8px 12px;
            border-radius: 8px;
            margin-right: 5px;
        }

        .delete-btn {
            background: #fee2e2;
            color: #b91c1c;
            padding: 8px 12px;
            border-radius: 8px;
        }

        .edit-btn:hover,
        .delete-btn:hover {
            transform: scale(1.05);
        }

        /* ================= NOTIFICATION ================= */

        #message {
            position: fixed;
            top: 25px;
            right: 25px;
            padding: 15px 22px;
            background: #16a34a;
            color: white;
            border-radius: 10px;
            box-shadow: 0 5px 20px rgba(0,0,0,0.2);
            display: none;
            z-index: 1000;
        }

        /* ================= EMPTY ================= */

        .empty {
            text-align: center;
            padding: 35px;
            color: #94a3b8;
        }

        /* ================= DARK MODE ================= */

        body.dark {
            background: #0f172a;
            color: #e2e8f0;
        }

        body.dark .stat-card,
        body.dark .form-card,
        body.dark .table-card {
            background: #1e293b;
            color: #e2e8f0;
        }

        body.dark .welcome p,
        body.dark .stat-card p,
        body.dark .form-header span {
            color: #94a3b8;
        }

        body.dark .form-group input,
        body.dark .search-box {
            background: #0f172a;
            color: white;
            border-color: #334155;
        }

        body.dark th {
            background: #0f172a;
        }

        body.dark tr:hover {
            background: #263449;
        }

        /* ================= RESPONSIVE ================= */

        @media(max-width: 750px) {

            .stats {
                grid-template-columns: 1fr;
            }

            .form-grid {
                grid-template-columns: 1fr;
            }

            .table-header {
                flex-direction: column;
                align-items: flex-start;
                gap: 15px;
            }

            .search-box {
                width: 100%;
            }

            header {
                padding: 18px 5%;
            }

        }

    </style>
</head>


<body>

<header>

    <div class="logo">

        <div class="logo-icon">
            👥
        </div>

        <div>
            <h1>EmployeeHub</h1>
            <p>Employee Management System</p>
        </div>

    </div>

    <button class="dark-btn" onclick="toggleDarkMode()">
        🌙 Dark Mode
    </button>

</header>


<div class="container">

    <div class="welcome">

        <h2>Welcome to EmployeeHub 👋</h2>

        <p>
            Manage your employees easily from one place.
        </p>

    </div>


    <!-- STATISTICS -->

    <div class="stats">

        <div class="stat-card">

            <div class="stat-icon">
                👥
            </div>

            <div>
                <h3 id="totalEmployees">0</h3>
                <p>Total Employees</p>
            </div>

        </div>


        <div class="stat-card">

            <div class="stat-icon">
                🏢
            </div>

            <div>
                <h3 id="totalDepartments">0</h3>
                <p>Departments</p>
            </div>

        </div>


        <div class="stat-card">

            <div class="stat-icon">
                💰
            </div>

            <div>
                <h3 id="averageSalary">₹0</h3>
                <p>Average Salary</p>
            </div>

        </div>

    </div>


    <!-- FORM -->

    <div class="form-card">

        <div class="form-header">

            <div>
                <h2 id="formTitle">➕ Add New Employee</h2>
                <span>Enter employee details below</span>
            </div>

        </div>


        <form id="employeeForm">

            <input type="hidden" id="employeeId">


            <div class="form-grid">

                <div class="form-group">

                    <label>👤 Employee Name</label>

                    <input
                        type="text"
                        id="name"
                        placeholder="Enter employee name"
                        required
                    >

                </div>


                <div class="form-group">

                    <label>📧 Email Address</label>

                    <input
                        type="email"
                        id="email"
                        placeholder="employee@example.com"
                        required
                    >

                </div>


                <div class="form-group">

                    <label>🏢 Department</label>

                    <input
                        type="text"
                        id="department"
                        placeholder="e.g. Engineering"
                        required
                    >

                </div>


                <div class="form-group">

                    <label>💰 Salary</label>

                    <input
                        type="number"
                        id="salary"
                        placeholder="Enter salary"
                        required
                    >

                </div>

            </div>


            <div class="form-actions">

                <button
                    type="submit"
                    class="primary-btn"
                    id="submitBtn">

                    ➕ Add Employee

                </button>


                <button
                    type="button"
                    class="cancel-btn"
                    id="cancelBtn"
                    onclick="cancelEdit()"
                    style="display:none;">

                    Cancel

                </button>

            </div>

        </form>

    </div>


    <!-- EMPLOYEE TABLE -->

    <div class="table-card">

        <div class="table-header">

            <h2>👨‍💼 Employee Directory</h2>

            <input
                type="text"
                id="searchBox"
                class="search-box"
                placeholder="🔍 Search employees..."
                onkeyup="searchEmployees()"
            >

        </div>


        <div class="table-wrapper">

            <table>

                <thead>

                    <tr>

                        <th>ID</th>

                        <th>Employee</th>

                        <th>Email</th>

                        <th>Department</th>

                        <th>Salary</th>

                        <th>Actions</th>

                    </tr>

                </thead>


                <tbody id="employeeTableBody">

                </tbody>

            </table>

        </div>

    </div>

</div>


<div id="message"></div>


<script>

const API_URL = "/employees";

let editingId = null;

let allEmployees = [];


// ============================================
// LOAD EMPLOYEES
// ============================================

document.addEventListener("DOMContentLoaded", loadEmployees);


async function loadEmployees() {

    try {

        const response = await fetch(API_URL);

        if (!response.ok) {
            throw new Error("Could not load employees");
        }

        allEmployees = await response.json();

        displayEmployees(allEmployees);

        updateStatistics(allEmployees);

    }

    catch (error) {

        showMessage(
            "❌ Error loading employees",
            true
        );

    }

}


// ============================================
// DISPLAY EMPLOYEES
// ============================================

function displayEmployees(employees) {

    const tableBody =
        document.getElementById("employeeTableBody");

    tableBody.innerHTML = "";


    if (employees.length === 0) {

        tableBody.innerHTML = `
            <tr>
                <td colspan="6" class="empty">
                    👥 No employees found
                </td>
            </tr>
        `;

        return;
    }


    employees.forEach(employee => {

        const row = document.createElement("tr");


        row.innerHTML = `

            <td>
                <span class="employee-id">
                    #${employee.id}
                </span>
            </td>

            <td>
                <span class="employee-name">
                    ${employee.name}
                </span>
            </td>

            <td>
                ${employee.email}
            </td>

            <td>
                <span class="department">
                    ${employee.department}
                </span>
            </td>

            <td>
                ₹${Number(employee.salary).toLocaleString("en-IN")}
            </td>

            <td>

                <button
                    class="edit-btn"
                    onclick='editEmployee(${JSON.stringify(employee)})'>

                    ✏️ Edit

                </button>


                <button
                    class="delete-btn"
                    onclick="deleteEmployee(${employee.id})">

                    🗑️ Delete

                </button>

            </td>

        `;


        tableBody.appendChild(row);

    });

}


// ============================================
// ADD / UPDATE EMPLOYEE
// ============================================

document
    .getElementById("employeeForm")
    .addEventListener("submit", async function(event) {

        event.preventDefault();


        const employee = {

            name:
                document.getElementById("name").value,

            email:
                document.getElementById("email").value,

            department:
                document.getElementById("department").value,

            salary:
                Number(
                    document.getElementById("salary").value
                )

        };


        try {

            let response;


            if (editingId === null) {

                // POST

                response = await fetch(API_URL, {

                    method: "POST",

                    headers: {
                        "Content-Type": "application/json"
                    },

                    body: JSON.stringify(employee)

                });

            }

            else {

                // PUT

                response = await fetch(
                    `${API_URL}/${editingId}`,
                    {

                        method: "PUT",

                        headers: {
                            "Content-Type": "application/json"
                        },

                        body: JSON.stringify(employee)

                    }
                );

            }


            if (!response.ok) {
                throw new Error("Request failed");
            }


            showMessage(
                editingId === null
                    ? "✅ Employee added successfully!"
                    : "✅ Employee updated successfully!"
            );


            resetForm();

            loadEmployees();

        }

        catch (error) {

            showMessage(
                "❌ Something went wrong",
                true
            );

        }

    });


// ============================================
// EDIT EMPLOYEE
// ============================================

function editEmployee(employee) {

    editingId = employee.id;


    document.getElementById("name").value =
        employee.name;

    document.getElementById("email").value =
        employee.email;

    document.getElementById("department").value =
        employee.department;

    document.getElementById("salary").value =
        employee.salary;


    document.getElementById("formTitle").innerText =
        "✏️ Update Employee";


    document.getElementById("submitBtn").innerText =
        "💾 Update Employee";


    document.getElementById("cancelBtn").style.display =
        "inline-block";


    window.scrollTo({
        top: 300,
        behavior: "smooth"
    });

}


// ============================================
// DELETE EMPLOYEE
// ============================================

async function deleteEmployee(id) {

    if (!confirm(
        "Are you sure you want to delete this employee?"
    )) {

        return;

    }


    try {

        const response = await fetch(
            `${API_URL}/${id}`,
            {
                method: "DELETE"
            }
        );


        if (!response.ok) {
            throw new Error("Delete failed");
        }


        showMessage(
            "🗑️ Employee deleted successfully!"
        );


        loadEmployees();

    }

    catch (error) {

        showMessage(
            "❌ Delete failed",
            true
        );

    }

}


// ============================================
// SEARCH
// ============================================

function searchEmployees() {

    const search =
        document
            .getElementById("searchBox")
            .value
            .toLowerCase();


    const filtered =
        allEmployees.filter(employee =>

            employee.name
                .toLowerCase()
                .includes(search)

            ||

            employee.email
                .toLowerCase()
                .includes(search)

            ||

            employee.department
                .toLowerCase()
                .includes(search)

        );


    displayEmployees(filtered);

}


// ============================================
// STATISTICS
// ============================================

function updateStatistics(employees) {

    document.getElementById("totalEmployees")
        .innerText = employees.length;


    const departments =
        new Set(
            employees.map(
                employee => employee.department
            )
        );


    document.getElementById("totalDepartments")
        .innerText = departments.size;


    if (employees.length > 0) {

        const totalSalary =
            employees.reduce(
                (sum, employee) =>
                    sum + Number(employee.salary),
                0
            );


        const average =
            totalSalary / employees.length;


        document.getElementById("averageSalary")
            .innerText =
            "₹" +
            Math.round(average)
                .toLocaleString("en-IN");

    }

    else {

        document.getElementById("averageSalary")
            .innerText = "₹0";

    }

}


// ============================================
// RESET FORM
// ============================================

function cancelEdit() {

    resetForm();

}


function resetForm() {

    editingId = null;


    document
        .getElementById("employeeForm")
        .reset();


    document.getElementById("formTitle")
        .innerText =
        "➕ Add New Employee";


    document.getElementById("submitBtn")
        .innerText =
        "➕ Add Employee";


    document.getElementById("cancelBtn")
        .style.display =
        "none";

}


// ============================================
// MESSAGE
// ============================================

function showMessage(message, error = false) {

    const element =
        document.getElementById("message");


    element.innerText = message;

    element.style.background =
        error ? "#dc2626" : "#16a34a";

    element.style.display = "block";


    setTimeout(() => {

        element.style.display = "none";

    }, 3000);

}


// ============================================
// DARK MODE
// ============================================

function toggleDarkMode() {

    document.body.classList.toggle("dark");

}

</script>

</body>

</html>
